<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Juego | Moquegua Turística</title><link rel="stylesheet" href="style.css"><style>main{max-width:750px;margin:45px auto;padding:28px;text-align:center;background:white;border-radius:16px}button{padding:12px 22px;margin:9px;border:0;border-radius:8px;background:#187c66;color:white;cursor:pointer}#resultado{font-weight:bold;margin:18px}</style></head><body><header class="encabezado-principal"><div class="barra"><img src="imagenes/escudo.png" alt="Escudo de Moquegua"><h1>Moquegua Turística</h1><nav><a href="index.html">Inicio</a><a href="lugares.html">Lugares turísticos</a><a href="galeria.html">Galería</a><a href="juego.html">Juego</a><a href="contacto.html">Contacto</a></nav></div></header><main><h2>¿Cuánto conoces Moquegua?</h2><p id="pregunta"></p><div id="opciones"></div><p id="resultado" aria-live="polite"></p><button id="siguiente" type="button">Siguiente pregunta</button></main><footer><p>© 2026 Moquegua Turística</p></footer><script>const preguntas=[{p:"¿Qué ciudad es capital de la región Moquegua?",o:["Moquegua","Ilo","Tacna"],r:0},{p:"¿Qué puerto se encuentra en la región Moquegua?",o:["Paita","Ilo","Callao"],r:1},{p:"¿Cuál es un sitio arqueológico de Moquegua?",o:["Cerro Baúl","Chan Chan","Caral"],r:0}];let i=0,puntos=0,respondida=false;function mostrar(){respondida=false;let q=preguntas[i];document.getElementById('pregunta').textContent=q.p;document.getElementById('resultado').textContent='';document.getElementById('opciones').innerHTML='';q.o.forEach((o,n)=>{let b=document.createElement('button');b.textContent=o;b.onclick=()=>{if(respondida)return;respondida=true;if(n===q.r)puntos++;document.getElementById('resultado').textContent=n===q.r?'¡Correcto!':'Respuesta correcta: '+q.o[q.r]};document.getElementById('opciones').appendChild(b)})}document.getElementById('siguiente').onclick=()=>{i++;if(i>=preguntas.length){document.querySelector('main').innerHTML='<h2>Juego terminado</h2><p>Obtuviste '+puntos+' de '+preguntas.length+' puntos.</p><a href="juego.html">Volver a jugar</a>'}else mostrar()};mostrar();</script></body></html>
