<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Contáctanos Ahora!</title>
    <style>
        /* Fondo general de la página y estructura en columna vertical */
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background-color: #f4ecf7; /* Fondo lila suave */
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column; /* Apila el encabezado arriba y el contenido abajo */
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        } 

        /* 1. ESTILOS DEL ENCABEZADO SUPERIOR (ARRIBA DEL TODO) */
        .encabezado-principal {
            background-color: #ffffff;
            width: 100%;
            box-shadow: 0px 2px 10px rgba(0, 0, 0, 0.08);
            padding: 10px 40px;
            box-sizing: border-box;
        }

        .barra {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between; /* Escudo/Título a la izquierda, menú a la derecha */
            flex-wrap: wrap;
            gap: 15px;
        }

        /* Tamaño para el escudo en la barra */
        .barra img {
            height: 50px;
            width: auto;
            object-fit: contain;
        }

        .barra h1 {
            color: #333333;
            font-size: 22px;
            margin: 0;
            flex: 1;
            margin-left: 15px;
            text-align: left;
        }

        /* Estilos del menú de navegación horizontal */
        nav {
            display: flex;
            gap: 20px;
        }

        nav a {
            text-decoration: none;
            color: #1769aa;
            font-weight: 600;
            font-size: 15px;
            transition: color 0.2s ease;
            padding: 5px 0;
        }

        nav a:hover {
            color: #27ae60;
        }


        /* 2. CONTENEDOR PARA EL FORMULARIO CUADRADO */
        .contenedor-principal {
            display: flex;
            flex: 1;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            width: 100%;
            box-sizing: border-box;
        }

        .tarjeta-formulario { 
            background-color: #ffffff; 
            width: 100%;
            max-width: 400px; /* Ancho del cuadrado */
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0px 8px 24px rgba(0, 0, 0, 0.12); 
            text-align: center;
            box-sizing: border-box;
        } 

        /* Estilo para la imagen redonda de Shinobu */
        .imagen-cabecera {
            width: 120px; 
            height: 120px;
            object-fit: cover;
            border-radius: 50%; 
            margin-bottom: 15px;
            border: 3px solid #27ae60;
        }

        .tarjeta-formulario h1 {
            color: #333333;
            font-size: 20px;
            margin: 10px 0 5px 0;
        }

        .subtitulo {
            color: #666666;
            margin-bottom: 25px;
            font-size: 14px;
        }

        form {
            text-align: left;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label { 
            display: block; 
            font-weight: 600;
            margin-bottom: 6px;
            color: #4a4a4a;
            font-size: 14px;
        } 

        input, textarea { 
            width: 100%; 
            padding: 10px 12px; 
            box-sizing: border-box; 
            border: 1px solid #cccccc;
            border-radius: 6px;
            font-size: 14px;
            background-color: #fafafa;
            transition: all 0.3s ease;
        } 

        input:focus, textarea:focus {
            border-color: #27ae60;
            background-color: #ffffff;
            outline: none;
            box-shadow: 0 0 5px rgba(39, 174, 96, 0.25);
        }

        textarea { 
            height: 80px; 
            resize: none; 
        } 

        button { 
            background-color: #27ae60; 
            color: white; 
            padding: 12px; 
            border: none; 
            margin-top: 10px; 
            width: 100%; 
            cursor: pointer; 
            font-weight: bold;
            font-size: 16px;
            border-radius: 6px;
            transition: background 0.2s ease;
        }

        button:hover {
            background-color: #219653; 
        }

        #respuesta {
            margin-top: 15px;
            font-weight: 600;
            font-size: 14px;
        }
        * ENCABEZADO DE MOQUEGUA TURÍSTICA */

.encabezado {
    background: linear-gradient(135deg, #751b40, #a63856);
    color: white;
    text-align: center;
    padding: 35px 20px;
}

.encabezado h1 {
    font-size: 36px;
    margin: 0 0 12px;
    color: white;
}

.encabezado p {
    font-size: 16px;
    margin-bottom: 25px;
}

/* MENÚ DE NAVEGACIÓN */

.menu {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
}

.menu a {
    color: white;
    text-decoration: none;
    font-size: 16px;
    font-weight: bold;
    padding: 12px 18px;
    border-radius: 8px;
    transition: background 0.3s;
}

.menu a:hover,
.menu a.activo {
    background-color: white;
    color: #751b40;
}

/* CENTRAR EL CONTENIDO */

main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 30px 20px;
}

main h2 {
    text-align: center;
    margin-bottom: 25px;
}

/* ADAPTACIÓN PARA CELULARES */

@media (max-width: 600px) {
    .encabezado h1 {
        font-size: 26px;
    }

    .menu {
        gap: 8px;
    }

    .menu a {
        font-size: 14px;
        padding: 10px;
    }
}

/* ENCABEZADO VERDE - LUGARES TURISTICOS */

body {
    margin: 0;
}

body header.encabezado-principal {
    display: block !important;
    width: 100%;
    background: #175b24 !important;
    color: white !important;
    padding: 18px 25px !important;
    text-align: left !important;
}

body header.encabezado-principal .barra {
    max-width: 1250px;
    margin: 0 auto;
    display: flex !important;
    flex-direction: row !important;
    align-items: center !important;
    justify-content: space-between;
    gap: 25px;
}

body header.encabezado-principal .barra img {
    width: 55px;
    height: 75px;
    object-fit: contain;
    flex-shrink: 0;
}

body header.encabezado-principal .barra h1 {
    color: white !important;
    font-size: 32px;
    margin: 0 !important;
    white-space: nowrap;
}

body header.encabezado-principal .barra nav {
    display: flex !important;
    flex-direction: row !important;
    align-items: center;
    justify-content: flex-end !important;
    flex-wrap: wrap;
    gap: 20px;
    margin-left: auto;
}

body header.encabezado-principal .barra nav a {
    color: white !important;
    text-decoration: none !important;
    background: transparent !important;
    font-size: 16px;
    font-weight: normal;
    padding: 8px 0;
    white-space: nowrap;
}

body header.encabezado-principal .barra nav a:hover {
    color: #ffdd77 !important;
}

@media (max-width: 900px) {
    body header.encabezado-principal .barra {
        flex-wrap: wrap;
        justify-content: center;
    }

    body header.encabezado-principal .barra h1 {
        white-space: normal;
    }

    body header.encabezado-principal .barra nav {
        margin-left: 0;
        justify-content: center !important;
    }
}
/* Pie de página */
footer {
    text-align: center;
    background-color: #43A047;
    color: white;
    padding: 18px;
}

    </style>
</head>
<body>

    <!-- EL ENCABEZADO AHORA SE MANTIENE COMPLETAMENTE ARRIBA -->
    <header class="encabezado-principal">
        <div class="barra">
            <img src="imagenes/escudo.png" alt="Escudo de Moquegua">
            <h1>Moquegua Turística</h1>
            <nav>
                <a href="index.html">Inicio</a>
                <a href="lugares.html">Lugares turísticos</a>
                <a href="galeria.html">Galería</a>
                <a href="juego.html">Juego</a>
                <a href="contacto.html">Contacto</a>
            </nav>
        </div>
    </header>

    <!-- ESTE CONTENEDOR CENTRA EL FORMULARIO CUADRADO EN EL ESPACIO RESTANTE -->
    <div class="contenedor-principal">
        <div class="tarjeta-formulario">
            <img src="imagenes/pendiente-02.svg" alt="Contacto" class="imagen-cabecera">
            
            <h1>¡Ponte en contacto con shinobu aoki!</h1>
            <p class="subtitulo">Completa el siguiente formulario para shinobu</p>
            
            <form id="formulario">
                <div class="form-group">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" placeholder="Tu nombre completo">
                </div>
                
                <div class="form-group">
                    <label for="correo">Correo electrónico:</label>
                    <input type="email" id="correo" placeholder="ejemplo@correo.com">
                </div>

                <div class="form-group">
                    <label for="telefono">Teléfono:</label>
                    <input type="tel" id="telefono" placeholder="Ej. 987654321">
                </div>
                
                <div class="form-group">
                    <label for="mensaje">Mensaje:</label>
                    <textarea id="mensaje" placeholder="Escribe tu mensaje aquí..."></textarea>
                </div>
                
                <button type="submit">¡Enviar Mensaje Ahora!</button> 
            </form>
            
            <p id="respuesta"></p>
        </div>
    </div>

    <!-- Script de validación interactiva -->
    <script>
        const formulario = document.getElementById("formulario"); 

        formulario.addEventListener("submit", function(event) { 
            event.preventDefault(); 
            
            let nombre = document.getElementById("nombre").value.trim(); 
            let correo = document.getElementById("correo").value.trim(); 
            let telefono = document.getElementById("telefono").value.trim(); 
            let mensaje = document.getElementById("mensaje").value.trim(); 
            let respuesta = document.getElementById("respuesta"); 
            
            if (nombre === "" || correo === "" || telefono === "" || mensaje === "") { 
                respuesta.textContent = "❌ Por favor, completa todos los campos requeridos."; 
                respuesta.style.color = "#c0392b"; 
            } else { 
                respuesta.textContent = "✨ ¡Excelente " + nombre + "! Solicitud registrada de manera exitosa."; 
                respuesta.style.color = "#27ae60"; 
                formulario.reset(); 
            } 
        });
    </script>
</body>
</html>
